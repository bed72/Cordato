services:
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POCKETBASE_PUBLIC_URL: ${POCKETBASE_PUBLIC_URL:-https://pocketbase.cordato.cloud}
      POCKETBASE_ADMIN_EMAIL: ${POCKETBASE_ADMIN_EMAIL:-}
      POCKETBASE_ADMIN_PASSWORD: ${POCKETBASE_ADMIN_PASSWORD:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      POCKETBASE_ENCRYPTION_KEY: ${POCKETBASE_ENCRYPTION_KEY:?Configure a chave de criptografia de 32 caracteres}
    expose:
      - "8090"
    volumes:
      - pocketbase_data:/pb/pb_data
    networks:
      - dokploy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "--timeout=4", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pocketbase_data:

networks:
  dokploy:
    external: true
    name: dokploy-network
