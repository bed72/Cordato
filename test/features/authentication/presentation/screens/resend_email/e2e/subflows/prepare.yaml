appId: com.bed.cordato
---
- runScript: ../scripts/configure.js
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: Continuar
    timeout: 15000
- tapOn: Continuar
- tapOn: Crie agora
- runFlow: ../../../sign_up/e2e/subflows/fill.yaml
- tapOn:
    text: Criar conta
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: Verifique seu e-mail
    timeout: 15000
- assertVisible: ${EMAIL}
- assertVisible:
    text: Reenviar
    enabled: true
- runScript: ../../../sign_up/e2e/scripts/stats.js
- assertTrue: ${output.stats.requests === 0}
- assertNotVisible: Você poderá reenviar em .*
