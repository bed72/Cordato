appId: com.bed.cordato
name: Resend-email - Loading
tags: [resend-email, loading]
env:
  TEST_SERVER: http://127.0.0.1:8767
  SCENARIO: loading
  EMAIL: Person@Example.com
  PASSWORD: Teste1
onFlowComplete:
  - runScript: ../../sign_up/e2e/scripts/release.js
---
- runFlow: subflows/prepare.yaml
- tapOn:
    text: Reenviar
    repeat: 2
    retryTapIfNoChange: false
- assertVisible:
    text: ${EMAIL}
    enabled: false
- assertNotVisible: E-mail reenviado
- runScript: ../../sign_up/e2e/scripts/stats.js
- assertTrue: ${output.stats.requests === 1 && output.stats.completed === 0}
- runScript: ../../sign_up/e2e/scripts/release.js
- assertVisible: E-mail reenviado
- assertVisible:
    text: Reenviar
    enabled: false
- runScript: ../../sign_up/e2e/scripts/stats.js
- assertTrue: ${output.stats.requests === 1 && output.stats.credentialsMatch && output.stats.unexpected.length === 0}
