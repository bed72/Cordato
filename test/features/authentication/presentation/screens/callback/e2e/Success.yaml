appId: com.bed.cordato
name: Callback - Success
tags: [callback, success]
env:
  TEST_SERVER: http://127.0.0.1:8768
  CALLBACK_BASE: https://app.cordato.cloud/authentication/confirm-email
  SCENARIO: success
---
- runFlow: subflows/prepare.yaml
- assertVisible: E-mail confirmado
- assertVisible: Entre na sua conta para continuar.
- assertVisible: Que bom ter você por aqui
- runScript: ../../sign_up/e2e/scripts/stats.js
- assertTrue: ${output.stats.requests === 1 && output.stats.credentialsMatch && output.stats.unexpected.length === 0}
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: Continuar
    timeout: 15000
