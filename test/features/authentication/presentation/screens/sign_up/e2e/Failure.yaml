appId: com.bed.cordato
name: Sign-up - Failure
tags: [sign-up, failure]
env:
  TEST_SERVER: http://127.0.0.1:8766
  SCENARIO: failure
  EMAIL: Person@Example.com
  PASSWORD: Teste1
---
- runFlow: subflows/prepare.yaml
- tapOn: Criar conta
- assertVisible: E-mail obrigatório
- assertVisible: Senha obrigatória
- runScript: scripts/stats.js
- assertTrue: ${output.stats.requests === 0}
- runFlow: subflows/fill.yaml
- tapOn:
    text: Criar conta
    retryTapIfNoChange: false
- assertVisible: E-mail já cadastrado.
- assertVisible: ${EMAIL}
- assertVisible: Vamos lá
- runScript: scripts/stats.js
- assertTrue: ${output.stats.requests === 1}
- tapOn:
    text: Criar conta
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: Verifique seu e-mail
    timeout: 15000
- runScript: scripts/stats.js
- assertTrue: ${output.stats.requests === 2 && output.stats.credentialsMatch && output.stats.unexpected.length === 0}
