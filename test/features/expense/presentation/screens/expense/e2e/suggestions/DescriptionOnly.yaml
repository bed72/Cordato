appId: com.bed.cordato
name: Expense Suggestions - Description opens calculator
tags: [expense, suggestions, success]
env:
  TEST_SERVER: http://127.0.0.1:8771
  SCENARIO: suggestions-success
---
- runFlow: ../subflows/login.yaml
- tapOn: Adicionar gasto
- tapOn: '(?s)Descrição.*'
- inputText: Mer
- extendedWaitUntil:
    visible: '(?s).*Mercado.*Usar descrição.*'
    timeout: 10000
- tapOn: '(?s).*Mercado.*Usar descrição.*'
- assertVisible: Valor do gasto
- tapOn: '1'
- tapOn: '✓'
- tapOn:
    text: Cadastrar
    retryTapIfNoChange: false
- extendedWaitUntil:
    notVisible: Novo gasto
    timeout: 10000
- runScript: ../scripts/stats.js
- assertTrue: ${output.stats.operations.create === 1 && output.stats.amounts.indexOf(100) >= 0 && output.stats.descriptions.indexOf('Mercado') >= 0 && output.stats.authorized && output.stats.unexpected.length === 0}
