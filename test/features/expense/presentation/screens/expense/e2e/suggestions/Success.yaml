appId: com.bed.cordato
name: Expense Suggestions - Description and amount
tags: [expense, suggestions, success]
env:
  TEST_SERVER: http://127.0.0.1:8771
  SCENARIO: suggestions-success
---
- runFlow: ../subflows/login.yaml
- tapOn: Adicionar gasto
- tapOn: '(?s)Descrição.*'
- inputText: Alu
- extendedWaitUntil:
    visible: '(?s).*Aluguel.*Usar descrição e valor.*'
    timeout: 10000
- tapOn: '(?s).*Aluguel.*Usar descrição e valor.*'
- assertNotVisible: Valor do gasto
- tapOn:
    text: Cadastrar
    retryTapIfNoChange: false
- extendedWaitUntil:
    notVisible: Novo gasto
    timeout: 10000
- assertVisible: '(?s)Aluguel.*'
- runScript: ../scripts/stats.js
- assertTrue: ${output.stats.operations.create === 1 && output.stats.amounts.indexOf(160000) >= 0 && output.stats.descriptions.indexOf('Aluguel') >= 0 && output.stats.authorized && output.stats.unexpected.length === 0}
