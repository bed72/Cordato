appId: com.bed.cordato
name: Expense Suggestions - Failure preserves manual creation
tags: [expense, suggestions, failure]
env:
  TEST_SERVER: http://127.0.0.1:8771
  SCENARIO: suggestions-failure
---
- runFlow: ../subflows/login.yaml
- runFlow: ../subflows/form.yaml
- assertNotVisible: Sugestões indisponíveis
- tapOn:
    text: Cadastrar
    retryTapIfNoChange: false
- extendedWaitUntil:
    notVisible: Novo gasto
    timeout: 10000
- runScript: ../scripts/stats.js
- assertTrue: ${output.stats.operations.suggestions >= 1 && output.stats.operations.create === 1 && output.stats.authorized && output.stats.unexpected.length === 0}
