appId: com.bed.cordato
name: Expense Suggestions - Loading does not block form
tags: [expense, suggestions, loading]
env:
  TEST_SERVER: http://127.0.0.1:8771
  SCENARIO: suggestions-loading
onFlowComplete:
  - runScript: ../scripts/release.js
---
- runFlow: ../subflows/login.yaml
- tapOn: Adicionar gasto
- tapOn: '(?s)Descrição.*'
- inputText: Alu
- extendedWaitUntil:
    visible: Buscando sugestões
    timeout: 10000
- assertVisible:
    text: Cadastrar
    enabled: true
- tapOn: Novo gasto
- tapOn: '(?s)Valor.*'
- assertVisible: Valor do gasto
- tapOn: '1'
- tapOn: '✓'
- runScript: ../scripts/release.js
- assertNotVisible: 'Usar descrição e valor'
- tapOn:
    text: Cadastrar
    retryTapIfNoChange: false
- extendedWaitUntil:
    notVisible: Novo gasto
    timeout: 10000
- runScript: ../scripts/stats.js
- assertTrue: ${output.stats.operations.suggestions >= 1 && output.stats.operations.create === 1 && output.stats.authorized && output.stats.unexpected.length === 0}
