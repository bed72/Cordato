appId: com.bed.cordato
name: Expense - Creation Success
tags: [expense, success]
env:
  TEST_SERVER: http://127.0.0.1:8771
  SCENARIO: success
---
- runFlow: subflows/login.yaml
- runFlow: subflows/form.yaml
- tapOn:
    text: Cadastrar
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: Gasto cadastrado
    timeout: 10000
- assertNotVisible: Novo gasto
- runScript: scripts/stats.js
- assertTrue: ${output.stats.operations.create === 1 && output.stats.authorized && output.stats.unexpected.length === 0}
