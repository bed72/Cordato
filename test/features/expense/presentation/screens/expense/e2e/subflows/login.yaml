appId: com.bed.cordato
---
- runScript: ../scripts/configure.js
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: Continuar
    timeout: 15000
- tapOn: Continuar
- tapOn: Digite seu e-mail
- inputText: Person@Example.com
- tapOn: Digite sua senha
- inputText: Teste1
- hideKeyboard
- runFlow:
    when:
      visible: Entrar
    commands:
      - tapOn:
          text: Entrar
          retryTapIfNoChange: false
- extendedWaitUntil:
    visible: '(?s).*Pessoa E2E.*'
    timeout: 15000
