appId: com.bed.cordato
name: Expenses - List and Delete Success
tags: [expense, expenses, success]
env:
  TEST_SERVER: http://127.0.0.1:8771
  SCENARIO: success
---
- runFlow: subflows/list.yaml
- runFlow: subflows/delete.yaml
- extendedWaitUntil:
    visible: Despesa excluída
    timeout: 10000
- assertVisible: Ainda sem despesas
- runScript: ../../expense/e2e/scripts/stats.js
- assertTrue: ${output.stats.operations.delete === 1 && output.stats.authorized && output.stats.unexpected.length === 0}
