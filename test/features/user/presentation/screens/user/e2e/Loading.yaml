appId: com.bed.cordato
name: User - Loading
tags: [user, loading]
env:
  TEST_SERVER: http://127.0.0.1:8770
  SCENARIO: loading
onFlowComplete:
  - runScript: scripts/release.js
---
- runFlow: subflows/prepare.yaml
- tapOn: Gerar outro avatar
- extendedWaitUntil:
    visible:
      text: Gerar outro avatar
      enabled: false
    timeout: 10000
- assertVisible:
    text: Excluir conta
    enabled: false
- runScript: scripts/stats.js
- assertTrue: ${output.stats.avatarRequests === 1 && output.stats.deleteRequests === 0}
- runScript: scripts/release.js
- extendedWaitUntil:
    visible: Avatar atualizado
    timeout: 10000
- assertVisible:
    text: Gerar outro avatar
    enabled: true
- runScript: scripts/stats.js
- assertTrue: ${output.stats.avatarRequests === 1 && output.stats.authorized && output.stats.unexpected.length === 0}
