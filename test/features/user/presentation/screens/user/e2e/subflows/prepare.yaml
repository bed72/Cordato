appId: com.bed.cordato
---
- runScript: ../scripts/configure.js
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: Continuar
    timeout: 15000
- tapOn: Continuar
- tapOn: Digite seu e-mail
- inputText: Person@Example.com
- tapOn: Digite sua senha
- inputText: Teste1
- hideKeyboard
- tapOn:
    text: Entrar
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: Pessoa E2E
    timeout: 15000
- tapOn: Menu
- tapOn: Dados pessoais
- assertVisible: Gerencie os dados da sua conta.
- extendedWaitUntil:
    visible: Avatar de Pessoa E2E
    timeout: 15000
