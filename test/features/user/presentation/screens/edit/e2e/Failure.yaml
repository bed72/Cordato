appId: com.bed.cordato
name: Edit User - Failure
tags: [user, edit, failure]
env:
  TEST_SERVER: http://127.0.0.1:8770
  SCENARIO: edit-failure
---
- runFlow: ../../user/e2e/subflows/prepare.yaml
- tapOn: '(?s)Nome.*'
- tapOn: Pessoa E2E
- eraseText
- inputText: Novo nome
- hideKeyboard
- tapOn:
    text: Atualizar
    retryTapIfNoChange: false
- assertVisible: Nome recusado
- assertVisible: Novo nome
- runScript: ../../user/e2e/scripts/stats.js
- assertTrue: ${output.stats.nameRequests === 1 && output.stats.name === 'Pessoa E2E'}
- tapOn: Novo nome
- eraseText
- inputText: Outro nome
- hideKeyboard
- assertNotVisible: Nome recusado
- tapOn:
    text: Atualizar
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: Gerencie os dados da sua conta.
    timeout: 10000
- runScript: ../../user/e2e/scripts/stats.js
- assertTrue: ${output.stats.nameRequests === 2 && output.stats.name === 'Outro nome' && output.stats.authorized && output.stats.unexpected.length === 0}
