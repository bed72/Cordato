appId: com.bed.cordato
name: Logout - Success
tags: [logout, success]
env:
  TEST_SERVER: http://127.0.0.1:8769
  SCENARIO: success
  EMAIL: Person@Example.com
  PASSWORD: Teste1
---
- runFlow: subflows/prepare.yaml
- tapOn: Sair
- assertVisible: Realmente deseja sair?
- tapOn: Voltar
- assertVisible: Configurações
- runScript: scripts/stats.js
- assertTrue: ${output.stats.logoutRequests === 0}
- runFlow: subflows/confirm.yaml
- extendedWaitUntil:
    visible: Continuar
    timeout: 15000
- runScript: scripts/stats.js
- assertTrue: ${output.stats.logoutRequests === 0 && output.stats.unexpected.length === 0}
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: Continuar
    timeout: 15000
- assertNotVisible: Pessoa E2E
